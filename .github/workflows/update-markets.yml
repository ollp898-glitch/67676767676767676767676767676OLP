name: Update markets snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 17 * * *"
permissions:
  contents: write
concurrency:
  group: betx-market-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test scanner
        run: |
          node catalog.test.js
          node liquidity-rankings.test.js
          node scanner.integration.test.js
          node snapshot-publication.test.js
          node -e "new (require('node:vm').Script)(require('node:fs').readFileSync('google-sheets/BETX_TEST_SYNC.gs','utf8'))"
      - name: Run market scanner
        run: node scanner.js
      - name: Validate output
        run: node validate-catalog.js out
      - name: Build Google Sheets cache (optional; never blocks scanner)
        continue-on-error: true
        run: |
          node sheet-export.test.js
          node sheet-export.js out
          cp out/sheets.json /tmp/betx-sheets.json
          cp out/dashboard-stats.csv /tmp/betx-dashboard-stats.csv
      - name: Save complete validated snapshot
        uses: actions/upload-artifact@v4
        with:
          name: betx-complete-snapshot-${{ github.run_id }}
          path: out/
          retention-days: 7
      - name: Publish latest snapshot
        run: |
          node snapshot-publication.js prepare out /tmp/betx-output | tee -a "$GITHUB_STEP_SUMMARY"
          if find /tmp/betx-output -type f -size +104857600c -print -quit | grep -q .; then
            echo "Prepared snapshot still contains a file over 100 MiB" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf .
          git clean -fdx
          cp -R /tmp/betx-output/. .
          git add -A
          git commit -m "Update sports outcome snapshot"
          git push --force origin data

      - name: Publish Google Sheets cache independently
        continue-on-error: true
        run: |
          if test ! -s /tmp/betx-sheets.json; then
            echo 'Google Sheets cache unavailable; base scanner snapshot remains published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp /tmp/betx-sheets.json sheets.json
          if test -s /tmp/betx-dashboard-stats.csv; then cp /tmp/betx-dashboard-stats.csv dashboard-stats.csv; fi
          git add sheets.json dashboard-stats.csv
          git commit -m "Update Google Sheets cache" || exit 0
          git push origin HEAD:data
          echo 'Google Sheets cache published to data/sheets.json' >> "$GITHUB_STEP_SUMMARY"
