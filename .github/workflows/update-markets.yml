name: Update markets snapshot
on:
  workflow_dispatch:
    inputs:
      restore_data:
        description: Restore the last verified data snapshot
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 17 * * *"
permissions:
  contents: write
concurrency:
  group: betx-market-scan
  cancel-in-progress: false
jobs:
  scan:
    if: ${{ !inputs.restore_data }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test scanner and analytics
        run: |
          node catalog.test.js
          node analytics.test.js
          node combo.test.js
          node scanner-fixes.test.js
          node chat-reader.test.js
          node scanner.integration.test.js
          node snapshot-publication.test.js
          node --test wide-combo/wide-combo.test.js
          node --test wide-combo/candidates.test.js
          node --test combo2/combo2.test.js
      - name: Load previous published snapshot
        run: |
          git fetch --depth=1 origin data
          node snapshot-publication.js restore FETCH_HEAD markets.jsonl /tmp/betx-previous.jsonl
      - name: Run market scanner
        env:
          BETX_PREVIOUS_FILE: /tmp/betx-previous.jsonl
        run: node scanner.js
      - name: Validate output
        run: node validate-catalog.js out
      - name: Build independent Wide Combo 1.0
        run: |
          node wide-combo/run.js out
          if test ! -f out/wide-combo-error.json; then
            echo 'Wide Combo 1.0 built and validated.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Wide Combo 1.0 failed; previous data snapshot will be preserved.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build independent Combo Layer 2.0
        id: combo2
        run: |
          node combo2/build.js out
          node combo2/validate.js out
          node combo2/link-reader.js out
      - name: Save complete validated snapshot
        uses: actions/upload-artifact@v4
        with:
          name: betx-complete-snapshot-${{ github.run_id }}
          path: out/
          retention-days: 7
      - name: Publish latest snapshot
        run: |
          if test -f out/wide-combo-error.json; then
            echo 'Wide Combo failed; previous data snapshot preserved.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node snapshot-publication.js prepare out /tmp/betx-output | tee -a "$GITHUB_STEP_SUMMARY"
          if find /tmp/betx-output -type f -size +104857600c -print -quit | grep -q .; then
            echo "Prepared snapshot still contains a file over 100 MiB" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf .
          git clean -fdx
          cp -R /tmp/betx-output/. .
          git add -A
          git commit -m "Update outcome snapshot and analytics"
          git push --force origin data
  restore_data:
    if: ${{ inputs.restore_data }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore last verified catalog
        uses: actions/github-script@v7
        with:
          script: |
            const oldSha = '25aee37228c83f43e2129611b3f464c64d0eaacf';
            const expectedSha = '7e578d95df790624877db1b8340e91ebd7b6fca8';
            const {owner, repo} = context.repo;
            const current = await github.rest.git.getRef({owner, repo, ref: 'heads/data'});
            if (current.data.object.sha !== expectedSha) throw new Error('data moved; restore cancelled');
            await github.rest.git.updateRef({owner, repo, ref: 'heads/data', sha: oldSha, force: true});
            await core.summary.addRaw(`Restored data to ${oldSha}`).write();
