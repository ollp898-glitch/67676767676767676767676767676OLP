name: Publish Combo Layer 2.0 from existing snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betx-market-scan
  cancel-in-progress: false
jobs:
  layer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test combo2/combo2.test.js
      - uses: actions/checkout@v4
        with:
          ref: data
          path: snapshot
      - name: Build and validate from saved Combo rows only
        run: |
          sha256sum snapshot/combo-markets.jsonl snapshot/markets.jsonl > /tmp/source-checksums
          node combo2/build.js snapshot
          node combo2/validate.js snapshot
          node combo2/link-reader.js snapshot
          sha256sum --check /tmp/source-checksums
          node validate-catalog.js snapshot
      - name: Publish additive layer
        working-directory: snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combo-2/ CHAT-START.md README.md chat-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Combo Layer 2.0 from existing snapshot"
          git push origin HEAD:data
