name: Publish chat reader for existing snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betx-market-scan
  cancel-in-progress: false
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node chat-reader.test.js
      - uses: actions/checkout@v4
        with:
          ref: data
          path: snapshot
      - name: Generate and verify small reader files
        run: node chat-reader.js snapshot
      - name: Publish reader without changing source data
        working-directory: snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHAT-START.md README.md chat-manifest.json chat/ index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish bounded chat reader for existing snapshot"
          git push origin HEAD:data
